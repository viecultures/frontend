<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <!-- Font preload — ưu tiên load 2 weight quan trọng nhất (400 + 700) trước -->

      rel="preload"
      href="https://fonts.gstatic.com/s/bévietnam/v34/i7dOIFdlayuLfWIAQLNS.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- Google Fonts — display=swap tránh FOIT, dùng fallback font trong lúc load -->

      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;0,900;1,400;1,600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
